name: moneykeeper-platform

services:
  moneykeeper-platform:
    image: rochelle98/moneykeeper-back:${MONEYKEEPER_IMAGE_TAG:-platform}
    container_name: moneykeeper-platform
    restart: unless-stopped
    ports:
      - "${MONEYKEEPER_APP_PORT:-8082}:8081"
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
      SERVER_PORT: 8081
      TZ: ${TZ:-Europe/London}
      MONEYKEEPER_DB_URL: jdbc:mysql://${MONEYKEEPER_DB_HOST:-mysql}:${MONEYKEEPER_DB_PORT:-3306}/${MONEYKEEPER_DB_NAME:-moneykeeper_platform}?useUnicode=true&characterEncoding=utf8&allowPublicKeyRetrieval=true&serverTimezone=UTC
      MONEYKEEPER_DB_USERNAME: ${MONEYKEEPER_DB_USERNAME:-moneykeeper}
      MONEYKEEPER_DB_PASSWORD: ${MONEYKEEPER_DB_PASSWORD}
      MONEYKEEPER_REDIS_HOST: ${MONEYKEEPER_REDIS_HOST:-redis}
      MONEYKEEPER_REDIS_PORT: ${MONEYKEEPER_REDIS_PORT:-6379}
      MONEYKEEPER_REDIS_PASSWORD: ${MONEYKEEPER_REDIS_PASSWORD:-}
      MONEYKEEPER_REDIS_DATABASE: ${MONEYKEEPER_REDIS_DATABASE:-1}
      MONEYKEEPER_JWT_SECRET: ${MONEYKEEPER_JWT_SECRET}
      MONEYKEEPER_ELASTICSEARCH_ENABLED: "true"
      MONEYKEEPER_ELASTICSEARCH_HOST: ${MONEYKEEPER_ELASTICSEARCH_HOST:-elasticsearch}
      MONEYKEEPER_ELASTICSEARCH_PORT: ${MONEYKEEPER_ELASTICSEARCH_PORT:-9200}
      SPRING_ELASTICSEARCH_URIS: http://${MONEYKEEPER_ELASTICSEARCH_HOST:-elasticsearch}:${MONEYKEEPER_ELASTICSEARCH_PORT:-9200}
      MONEYKEEPER_ELASTICSEARCH_INDEX_NAME: ${MONEYKEEPER_ELASTICSEARCH_INDEX_NAME:-moneykeeper-records-platform}
      MONEYKEEPER_EXPORT_JOB_STORAGE_DIR: ${MONEYKEEPER_EXPORT_JOB_STORAGE_DIR:-/data/export-jobs}
      MONEYKEEPER_EXPORT_JOB_POLL_INTERVAL_MS: ${MONEYKEEPER_EXPORT_JOB_POLL_INTERVAL_MS:-5000}
      MONEYKEEPER_EXPORT_JOB_MAX_JOBS_PER_RUN: ${MONEYKEEPER_EXPORT_JOB_MAX_JOBS_PER_RUN:-3}
      MONEYKEEPER_KAFKA_ENABLED: ${MONEYKEEPER_KAFKA_ENABLED:-false}
      MONEYKEEPER_KAFKA_BOOTSTRAP_SERVERS: ${MONEYKEEPER_KAFKA_BOOTSTRAP_SERVERS:-kafka:9092}
      MONEYKEEPER_KAFKA_LISTENER_AUTO_STARTUP: ${MONEYKEEPER_KAFKA_LISTENER_AUTO_STARTUP:-false}
      MONEYKEEPER_KAFKA_RECORD_EVENT_TOPIC: ${MONEYKEEPER_KAFKA_RECORD_EVENT_TOPIC:-moneykeeper-record-events}
      MONEYKEEPER_KAFKA_EXPORT_JOB_TOPIC: ${MONEYKEEPER_KAFKA_EXPORT_JOB_TOPIC:-moneykeeper-export-job-events}
      MONEYKEEPER_NACOS_DISCOVERY_ENABLED: "false"
      MONEYKEEPER_NACOS_CONFIG_ENABLED: "false"
      MONEYKEEPER_DUBBO_ENABLED: "false"
      MONEYKEEPER_PAYMENT_ENABLED: "false"
      SPRING_CLOUD_NACOS_DISCOVERY_ENABLED: "false"
      SPRING_CLOUD_NACOS_CONFIG_ENABLED: "false"
      DUBBO_REGISTRY_ADDRESS: ${DUBBO_REGISTRY_ADDRESS:-N/A}
      DUBBO_REGISTRY_REGISTER: "false"
      DUBBO_CONFIG_CENTER_ADDRESS: ${DUBBO_CONFIG_CENTER_ADDRESS:-N/A}
    volumes:
      - ./data/moneykeeper-platform/export-jobs:${MONEYKEEPER_EXPORT_JOB_STORAGE_DIR:-/data/export-jobs}
    networks:
      - shared-services

networks:
  shared-services:
    external: true
    name: ${MONEYKEEPER_SHARED_NETWORK:-env_default}
