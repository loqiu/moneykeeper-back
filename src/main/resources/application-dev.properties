spring.datasource.url=${MONEYKEEPER_DB_URL:jdbc:mysql://localhost:3306/moneykeeper?useUnicode=true&characterEncoding=utf8&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${MONEYKEEPER_DB_USERNAME:root}
spring.datasource.password=${MONEYKEEPER_DB_PASSWORD:}
spring.datasource.driver-class-name=${MONEYKEEPER_DB_DRIVER:com.mysql.cj.jdbc.Driver}

mybatis-plus.type-aliases-package=com.loqiu.moneykeeper.entity
mybatis-plus.configuration.map-underscore-to-camel-case=true
mybatis-plus.global-config.db-config.logic-delete-field=deleted_at
mybatis-plus.global-config.db-config.logic-delete-value=1
mybatis-plus.global-config.db-config.logic-not-delete-value=0
mybatis-plus.configuration.log-impl=org.apache.ibatis.logging.log4j2.Log4j2Impl
mybatis-plus.global-config.db-config.page-size=20

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.enabled=${MONEYKEEPER_SWAGGER_ENABLED:true}
springdoc.swagger-ui.operations-sorter=alpha

spring.data.redis.host=${MONEYKEEPER_REDIS_HOST:localhost}
spring.data.redis.port=${MONEYKEEPER_REDIS_PORT:6379}
spring.data.redis.password=${MONEYKEEPER_REDIS_PASSWORD:}
spring.data.redis.database=${MONEYKEEPER_REDIS_DATABASE:0}

dubbo.consumer.check=false
dubbo.registry.register=true
dubbo.protocol.name=dubbo
dubbo.protocol.port=${MONEYKEEPER_DUBBO_PORT:20880}
dubbo.provider.alias=provider
dubbo.provider.token=123456
dubbo.provider.timeout=3000
dubbo.consumer.alias=consumer
dubbo.consumer.token=123456
dubbo.consumer.timeout=3000
