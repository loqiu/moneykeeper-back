spring.application.name=moneykeeper-back
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}
server.port=${SERVER_PORT:8081}
logging.config=classpath:log4j2-spring.xml

mybatis-plus.mapper-locations=classpath:mapper/*.xml
mybatis-plus.type-aliases-package=com.loqiu.moneykeeper.entity
mybatis-plus.configuration.log-impl=org.apache.ibatis.logging.log4j2.Log4j2Impl

app.security.jwt.secret=${MONEYKEEPER_JWT_SECRET:moneykeeper_secret_key}

google.oauth2.clientId=${GOOGLE_OAUTH_CLIENT_ID:161545064775-0d898na3c3cgrl8htbsod2o73smjvo3p.apps.googleusercontent.com}
google.oauth2.ios.clientId=${GOOGLE_OAUTH_IOS_CLIENT_ID:161545064775-5qpi87ucu47jf214khuah3ebu7spv16n.apps.googleusercontent.com}

app.kafka.enabled=${MONEYKEEPER_KAFKA_ENABLED:false}
app.kafka.bootstrap-servers=${MONEYKEEPER_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
app.kafka.consumer-group-id=${MONEYKEEPER_KAFKA_CONSUMER_GROUP:Kafka-Mk-ConsumerGroup}
app.kafka.listener-auto-startup=${MONEYKEEPER_KAFKA_LISTENER_AUTO_STARTUP:false}
spring.kafka.bootstrap-servers=${app.kafka.bootstrap-servers}
spring.kafka.consumer.bootstrap-servers=${app.kafka.bootstrap-servers}
spring.kafka.consumer.group-id=${app.kafka.consumer-group-id}
spring.kafka.consumer.auto-offset-reset=${MONEYKEEPER_KAFKA_AUTO_OFFSET_RESET:latest}
spring.kafka.consumer.enable-auto-commit=${MONEYKEEPER_KAFKA_ENABLE_AUTO_COMMIT:false}
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.producer.bootstrap-servers=${app.kafka.bootstrap-servers}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.listener.auto-startup=${app.kafka.listener-auto-startup}

app.elasticsearch.enabled=${MONEYKEEPER_ELASTICSEARCH_ENABLED:false}
app.elasticsearch.host=${MONEYKEEPER_ELASTICSEARCH_HOST:localhost}
app.elasticsearch.port=${MONEYKEEPER_ELASTICSEARCH_PORT:9200}
app.elasticsearch.username=${MONEYKEEPER_ELASTICSEARCH_USERNAME:}
app.elasticsearch.password=${MONEYKEEPER_ELASTICSEARCH_PASSWORD:}
app.elasticsearch.index-name=${MONEYKEEPER_ELASTICSEARCH_INDEX_NAME:moneykeeper-records}

app.payment.enabled=${MONEYKEEPER_PAYMENT_ENABLED:false}
app.payment.provider=${MONEYKEEPER_PAYMENT_PROVIDER:stripe}
app.payment.default-currency=${MONEYKEEPER_PAYMENT_DEFAULT_CURRENCY:usd}
app.payment.secret-key=${MONEYKEEPER_PAYMENT_SECRET_KEY:}
app.payment.webhook-secret=${MONEYKEEPER_PAYMENT_WEBHOOK_SECRET:}
app.payment.billing-portal-return-url=${MONEYKEEPER_PAYMENT_BILLING_PORTAL_RETURN_URL:}

app.dubbo.enabled=${MONEYKEEPER_DUBBO_ENABLED:false}
app.dubbo.application-name=${MONEYKEEPER_DUBBO_APPLICATION_NAME:${spring.application.name}}
app.dubbo.registry-address=${MONEYKEEPER_DUBBO_REGISTRY_ADDRESS:nacos://localhost:8848}
dubbo.application.name=${app.dubbo.application-name}
dubbo.registry.address=${app.dubbo.registry-address}

app.nacos.discovery.enabled=${MONEYKEEPER_NACOS_DISCOVERY_ENABLED:false}
app.nacos.discovery.server-addr=${MONEYKEEPER_NACOS_DISCOVERY_SERVER_ADDR:localhost:8848}
app.nacos.config.enabled=${MONEYKEEPER_NACOS_CONFIG_ENABLED:false}
app.nacos.config.server-addr=${MONEYKEEPER_NACOS_CONFIG_SERVER_ADDR:localhost:8848}
spring.cloud.nacos.discovery.enabled=${app.nacos.discovery.enabled}
spring.cloud.nacos.discovery.server-addr=${app.nacos.discovery.server-addr}
spring.cloud.nacos.config.enabled=${app.nacos.config.enabled}
spring.cloud.nacos.config.server-addr=${app.nacos.config.server-addr}

management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always
management.endpoint.health.probes.enabled=true
management.endpoint.health.group.liveness.include=livenessState,ping
management.endpoint.health.group.readiness.include=readinessState,diskSpace,integrations
management.health.livenessstate.enabled=true
management.health.readinessstate.enabled=true
management.info.env.enabled=true
management.metrics.tags.application=${spring.application.name}

info.app.name=${spring.application.name}
info.app.profile=${spring.profiles.active}

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.flyway.validate-on-migrate=true
spring.flyway.clean-disabled=true

app.export-jobs.storage-dir=${MONEYKEEPER_EXPORT_JOB_STORAGE_DIR:${java.io.tmpdir}/moneykeeper-exports}
app.export-jobs.poll-interval-ms=${MONEYKEEPER_EXPORT_JOB_POLL_INTERVAL_MS:5000}
app.export-jobs.max-jobs-per-run=${MONEYKEEPER_EXPORT_JOB_MAX_JOBS_PER_RUN:3}

