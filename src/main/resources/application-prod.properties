# nacos
#spring.config.import=optional:nacos:application-prod.properties
spring.cloud.nacos.discovery.server-addr=nacos:8848
spring.cloud.nacos.config.server-addr=nacos:8848
# dubbo
dubbo.application.name=moneykeeper-back
dubbo.registry.address=nacos://nacos:8848
#dubbo.registry.preferred-networks=8.208.121.218
dubbo.consumer.check=false
dubbo.registry.register=true
dubbo.protocol.name=dubbo
dubbo.protocol.port=20880
# dubbo provider
dubbo.provider.alias=provider
dubbo.provider.token=123456
dubbo.provider.timeout=3000
#dubbo consumer
dubbo.consumer.alias=consumer
dubbo.consumer.token=123456
dubbo.consumer.timeout=3000
#kafka consumer
spring.kafka.bootstrap-servers=kafka:9092
spring.kafka.consumer.bootstrap-servers=kafka:9092
spring.kafka.consumer.group-id=Kafka-Mk-ConsumerGroup
spring.kafka.consumer.auto-offset-reset=latest
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
#kafka producer
spring.kafka.producer.bootstrap-servers=kafka:9092
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
